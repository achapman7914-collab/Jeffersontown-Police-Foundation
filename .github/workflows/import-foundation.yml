name: Import Foundation Website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Foundation repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out current source repository
        uses: actions/checkout@v4
        with:
          repository: achapman7914-collab/KAPSS-Interactive-Map
          ref: main
          path: _source

      - name: Copy Foundation site to repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          cp -a _source/foundation-preview/. ./
          rm -rf _source

      - name: Use uploaded drone image in DFR card 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('dfr.html')
          s = p.read_text(encoding='utf-8')
          old_css = ".drone-img{background-image:linear-gradient(rgba(2,10,18,.08),rgba(2,10,18,.24)),url('dfr-hero-clean.jpg')}"
          old_css_cached = ".drone-img{background-image:linear-gradient(rgba(2,10,18,.08),rgba(2,10,18,.24)),url('dfr-hero-clean.jpg?v=20260917-1534')}"
          new_css = ".drone-img{background:#071827}.drone-img img{width:100%;height:100%;object-fit:cover;object-position:center 43%;display:block}"
          s = s.replace(old_css, new_css)
          s = s.replace(old_css_cached, new_css)
          s = s.replace('<div class="flow-image drone-img"></div>', '<div class="flow-image drone-img"><img src="dfr-drone-display.png?v=20260917-1558" alt="Skydio drone launching from its dock"></div>')
          s = s.replace('src="dfr-drone-display.jpg?v=20260917-1541"', 'src="dfr-drone-display.png?v=20260917-1558"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit imported Foundation site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import Foundation website from KAPSS repository"
          git push origin main
